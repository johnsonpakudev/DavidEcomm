name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ANALYTICS_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      ANALYTICS_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    env:
      ANALYTICS_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    env:
      ANALYTICS_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      ANALYTICS_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  cms-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ANALYTICS_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
      ENABLE_CMS: "true"
      ENABLE_ADMIN: "true"
      PAYLOAD_SECRET: "ci-test-secret-minimum-32-characters-long"
      ADMIN_PASSWORD: "ci-admin-password"
      ADMIN_SESSION_SECRET: "ci-admin-session-secret-32chars"
      DATABASE_URL: "postgresql://payload:payload@localhost:5432/payload"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: NODE_ENV=development npm run cms:migrate
      - run: npm run build
